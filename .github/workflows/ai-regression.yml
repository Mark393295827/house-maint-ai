name: AI Regression Integration

on:
  pull_request:
    branches: [ "main" ]

jobs:
  ai-regression-eval:
    name: Core LLM Regression (Accuracy Threshold >= 85%)
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci
        
      # Make sure the developer configures github secrets for GEMINI_API_KEY
      - name: Execute LLM Test Runner
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npm run test:ai
        
      - name: Report Status
        if: failure()
        run: |
          echo "::error title=AI Regression Failed::Accuracy fell below 85% acceptable limit. Please verify model drift or systemic prompt failures."
